[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Route server-side Gemini AI endpoints to Netlify Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/gemini/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/preps-ai"
  to = "/.netlify/functions/preps-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/gemini/:splat"
  status = 200
  force = true

# SPA fallback so all React Router pages (/materials, /cbt-mocks, /dpp, /analytics, /profile, /about, /admin) work directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
