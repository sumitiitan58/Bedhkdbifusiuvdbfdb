# Cloudflare Pages configuration for PREPSKM.IN
# Build command (Cloudflare Pages Dashboard): `bun run build` (or `npm run build`)
# Build output directory: `dist`
# CLI deploy: `npx wrangler pages deploy dist` (or `bunx wrangler pages deploy dist`)
#
# Configure API keys in Cloudflare Pages Dashboard -> Settings -> Environment Variables
# (or local `.dev.vars` for `npx wrangler pages dev dist`):
#   GEMINI_API_KEY
#   GROQ_API_KEY
#   MISTRAL_API_KEY
#   OPENROUTER_API_KEY
#   CLOUDFLARE_WORKERS_AI_API_KEY
#   DEEPSEEK_API_KEY
# Optional (for Cloudflare Workers AI REST endpoint):
#   CLOUDFLARE_ACCOUNT_ID

name = "prepskm"
compatibility_date = "2025-02-01"
pages_build_output_dir = "dist"
