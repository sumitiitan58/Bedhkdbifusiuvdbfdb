# Cloudflare Pages configuration for PREPSKM.IN
# Deploy via Cloudflare Pages Git integration (`npm run build`, output: `dist`)
# or via CLI: `npx wrangler pages deploy dist`
#
# Configure these 6 individual API keys separately in Cloudflare Pages Dashboard ->
# Settings -> Environment Variables (or local `.dev.vars` for `npx wrangler pages dev dist`):
#   GEMINI_API_KEY
#   GROQ_API_KEY
#   MISTRAL_API_KEY
#   OPENROUTER_API_KEY
#   CLOUDFLARE_WORKERS_AI_API_KEY
#   DEEPSEEK_API_KEY
# Optional (for Cloudflare Workers AI REST endpoint):
#   CLOUDFLARE_ACCOUNT_ID

name = "prepskm"
compatibility_date = "2025-02-01"
pages_build_output_dir = "dist"

[vars]
NODE_VERSION = "22"
[assets]
directory="./dist"
